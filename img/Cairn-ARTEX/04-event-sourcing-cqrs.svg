<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">事件溯源与 CQRS</title>
<desc id="desc">命令由写入模型校验后追加事件。事件流可重放以重建状态，也可通过独立投影生成面向规划和审计的查询视图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#BE753D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;}</style>
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<rect x="56" y="28" width="550" height="584" rx="22" fill="#FFF9F3" stroke="#EDDCCE" stroke-width="1.5"/>
<rect x="634" y="28" width="910" height="584" rx="22" fill="#FFF9F3" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="86" y="75" text-anchor="start" font-size="28" font-weight="600" fill="#4D3B30">写入模型</text>
<text x="664" y="75" text-anchor="start" font-size="28" font-weight="600" fill="#4D3B30">事件溯源</text>
<path d="M664 259 H1514" fill="none" stroke="#EDDCCE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="312" text-anchor="start" font-size="28" font-weight="600" fill="#4D3B30">读取模型</text>
<rect x="86" y="98" width="490" height="63" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331.0" y="139.5" text-anchor="middle" font-size="28" font-weight="500" fill="#4D3B30">写入命令</text>
<path d="M331 161 V203" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="86" y="203" width="490" height="66" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331.0" y="246.0" text-anchor="middle" font-size="28" font-weight="500" fill="#4D3B30">校验命令与当前状态</text>
<path d="M331 269 V319" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="352" y="302" text-anchor="start" font-size="21" font-weight="500" fill="#826B59">仅追加</text>
<rect x="86" y="319" width="490" height="257" rx="16" fill="#FDEBD9" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331" y="364" text-anchor="middle" font-size="29" font-weight="600" fill="#4D3B30">不可变事件流</text>
<rect x="125" y="384" width="412" height="48" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331.0" y="418.0" text-anchor="middle" font-size="23" font-weight="500" fill="#4D3B30">意图已声明</text>
<rect x="125" y="443" width="412" height="48" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331.0" y="477.0" text-anchor="middle" font-size="23" font-weight="500" fill="#4D3B30">意图已认领</text>
<rect x="125" y="502" width="412" height="48" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="331.0" y="536.0" text-anchor="middle" font-size="23" font-weight="500" fill="#4D3B30">探索已结束</text>
<rect x="663" y="112" width="228" height="76" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="777.0" y="160.0" text-anchor="middle" font-size="26" font-weight="500" fill="#4D3B30">重放事件</text>
<rect x="971" y="112" width="511" height="76" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="1226.5" y="160.0" text-anchor="middle" font-size="27" font-weight="500" fill="#4D3B30">重建当前状态</text>
<rect x="663" y="404" width="228" height="86" rx="13" fill="#FFFFFF" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="777.0" y="457.0" text-anchor="middle" font-size="26" font-weight="500" fill="#4D3B30">更新投影</text>
<rect x="971" y="355" width="511" height="82" rx="13" fill="#FDEBD9" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="1226.5" y="392.0" text-anchor="middle" font-size="26" font-weight="500" fill="#4D3B30">待探索方向</text>
<text x="1226.5" y="420.0" text-anchor="middle" font-size="21" font-weight="400" fill="#826B59">规划者查询</text>
<rect x="971" y="458" width="511" height="82" rx="13" fill="#FDEBD9" stroke="#EDDCCE" stroke-width="1.5"/>
<text x="1226.5" y="495.0" text-anchor="middle" font-size="26" font-weight="500" fill="#4D3B30">探索依赖与执行历史</text>
<text x="1226.5" y="523.0" text-anchor="middle" font-size="21" font-weight="400" fill="#826B59">审计者查询</text>
<path d="M576 447 H618 V150 H663" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M618 447 H663" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M891 150 H971" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M891 447 H930 V396 H971" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M930 447 V499 H971" fill="none" stroke="#BE753D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
