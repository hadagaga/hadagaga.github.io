<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="545" viewBox="0 0 1600 545" role="img" aria-labelledby="title desc">
<title id="title">区域点亮、关联点亮与语境切片</title>
<desc id="desc">三个面板采用同一套三维直角坐标与投影。长方体同时圈选三个坐标范围，包含 I₁、I₂。适用策略关系从 I₁ 连至 I₃。实线切片固定 z，保留 I₁ 至 I₄。虚线切片固定 x，仅用于展示改变约束维度后的切片方向。</desc>
