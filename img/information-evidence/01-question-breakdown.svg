<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">市场报告的问题拆解</title>
  <desc id="diagram-description">要判断价格走势，先核实两份报告能否直接比较。统计时间已核实为同一时段，样本范围还待核实。如果正文没有样本说明，就安排查找方法附录。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5 9 5 1 8.5Z" fill="#625b52" />
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="480" rx="20" fill="#fcfaf7" stroke="#e2d9cc" stroke-width="2" />

  <g fill="none" stroke="#625b52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 92V119" marker-end="url(#arrow)" />
    <path d="M360 183V207H188V229" marker-end="url(#arrow)" />
    <path d="M360 207H532V229" marker-end="url(#arrow)" />
    <path d="M532 324V369" marker-end="url(#arrow)" />
  </g>

  <rect x="204" y="30" width="312" height="62" rx="14" fill="#ecf2fa" stroke="#2d4e73" stroke-opacity=".28" stroke-width="1.5" />
  <rect x="204" y="121" width="312" height="62" rx="14" fill="#fff" stroke="#e2d9cc" stroke-width="1.5" />
  <rect x="32" y="232" width="312" height="92" rx="14" fill="#e8f4ee" stroke="#25594c" stroke-opacity=".28" stroke-width="1.5" />
  <rect x="376" y="232" width="312" height="92" rx="14" fill="#fff0e3" stroke="#954817" stroke-opacity=".28" stroke-width="1.5" />
  <rect x="376" y="372" width="312" height="78" rx="14" fill="#fff" stroke="#e2d9cc" stroke-width="1.5" />

  <g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="middle" fill="#292721">
    <g font-size="26" font-weight="600">
      <text x="360" y="70" fill="#2d4e73">判断价格走势</text>
      <text x="360" y="161">两份报告可比吗？</text>
      <text x="188" y="271">统计时间</text>
      <text x="532" y="271">样本范围</text>
      <text x="532" y="433">安排查找方法附录</text>
    </g>
    <g font-size="21" font-weight="500">
      <text x="188" y="302" fill="#25594c">已核实 · 同一时段</text>
      <text x="532" y="302" fill="#954817">待核实</text>
      <text x="532" y="402" fill="#625b52">如果正文没有样本说明</text>
    </g>
  </g>
</svg>
